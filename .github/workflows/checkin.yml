name: 华住会每日签到

on:
  schedule:
    - cron: '7 17 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 执行签到
        env:
          HZ_TOKEN: ${{ secrets.HZ_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          NOTIFY_ON: success
          RANDOM_DELAY: 600
        run: python3 checkin.py --once
